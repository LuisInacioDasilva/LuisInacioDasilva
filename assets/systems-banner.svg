<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Luis da Silva — desenvolvimento back-end e dados</title>
  <desc id="desc">Banner animado com o nome Luis da Silva, mais de cinco anos de experiência em back-end, dados, integrações, LLMs e automações.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111E"/>
      <stop offset=".56" stop-color="#0B1725"/>
      <stop offset="1" stop-color="#071B21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".19"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8BA9BB" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="12" y="12" width="1176" height="336" rx="22"/></clipPath>
  </defs>
  <style>
    .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .mono{font-family:"Cascadia Code",Consolas,monospace}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    .dash{animation:flow 14s linear infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes pulse{50%{opacity:.38;transform:scale(.84)}}
    @keyframes flow{to{stroke-dashoffset:-72}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.pulse,.dash,.cursor{animation:none}}
  </style>
  <rect width="1200" height="360" fill="#050B13"/>
  <rect x="12" y="12" width="1176" height="336" rx="22" fill="url(#surface)" stroke="#254455" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect x="12" y="12" width="1176" height="336" fill="url(#grid)"/>
    <path d="M0 278H690L810 132H1200" fill="none" stroke="url(#fade)" stroke-width="105"/>
    <path d="M14 12H1186" stroke="url(#edge)" stroke-width="3"/>
  </g>
  <g class="mono">
    <rect x="50" y="48" width="11" height="11" rx="2" fill="#4ADE80"/>
    <text x="74" y="58" fill="#7DE6CB" font-size="14" letter-spacing="2.3">ENGINEERING / BACK-END / DATA</text>
    <text x="51" y="167" fill="#F4FAFD" font-size="59" font-weight="800" letter-spacing="-3" class="sans">LUIS DA SILVA</text>
    <rect x="51" y="186" width="510" height="3" rx="1.5" fill="url(#edge)"/>
    <text x="52" y="225" fill="#BBD0DB" font-size="20" class="sans">Desenvolvedor back-end pleno</text>
    <text x="52" y="252" fill="#7DE6CB" font-size="15">+5 ANOS CONSTRUINDO SISTEMAS EM PRODUÇÃO</text>
  </g>
  <g class="mono" font-size="15" font-weight="700">
    <rect x="51" y="282" width="76" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="65" y="306" fill="#DAF8FF">C / C#</text>
    <rect x="136" y="282" width="69" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="151" y="306" fill="#DAF8FF">PHP</text>
    <rect x="214" y="282" width="73" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="225" y="306" fill="#DAF8FF">JAVA</text>
    <rect x="296" y="282" width="74" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="309" y="306" fill="#DAF8FF">NODE</text>
    <rect x="379" y="282" width="66" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="392" y="306" fill="#DAF8FF">SQL</text>
    <rect x="454" y="282" width="83" height="36" rx="8" fill="#12283B" stroke="#2B6A79"/>
    <text x="469" y="306" fill="#DAF8FF">LLMs</text>
  </g>
  <g class="mono">
    <rect x="649" y="44" width="491" height="272" rx="14" fill="#07121D" stroke="#345365"/>
    <path d="M649 78H1140" stroke="#345365"/>
    <circle cx="669" cy="61" r="4" fill="#4ADE80" class="pulse"/>
    <text x="685" y="66" fill="#8BA9BB" font-size="12" letter-spacing="1.8">SYSTEM TOPOLOGY</text>
    <text x="1117" y="66" fill="#4ADE80" font-size="11" text-anchor="end">ONLINE</text>
    <path class="dash" d="M750 161H820V131H910M854 161V252M910 131H977V191" fill="none" stroke="#2DD4BF" stroke-opacity=".54" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="682" y="121" width="135" height="79" rx="9" fill="#102738" stroke="#35A6A7"/>
    <text x="699" y="147" fill="#66E3D2" font-size="11">01 / CORE</text>
    <text x="699" y="177" fill="#EDF7FA" font-size="18" font-weight="700">BACK-END</text>
    <rect x="910" y="101" width="194" height="62" rx="9" fill="#0E2331" stroke="#2C6D80"/>
    <text x="926" y="126" fill="#7DD3FC" font-size="11">02 / DATA LAYER</text>
    <text x="926" y="147" fill="#E4F5FA" font-size="16">SQL · INTEGRITY</text>
    <rect x="759" y="229" width="179" height="59" rx="9" fill="#0E2331" stroke="#2C6D80"/>
    <text x="775" y="254" fill="#7DD3FC" font-size="11">03 / INTEGRATIONS</text>
    <text x="775" y="275" fill="#E4F5FA" font-size="15">APIs · ERP · EVENTS</text>
    <rect x="977" y="191" width="127" height="70" rx="9" fill="#0E2331" stroke="#2C6D80"/>
    <text x="993" y="217" fill="#7DD3FC" font-size="11">04 / SYSTEMS</text>
    <text x="993" y="240" fill="#E4F5FA" font-size="14">LLMs · n8n</text>
    <circle cx="820" cy="161" r="4" fill="#4ADE80" filter="url(#glow)" class="pulse"/>
    <circle cx="910" cy="131" r="4" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
    <circle cx="854" cy="229" r="4" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
    <circle cx="977" cy="191" r="4" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
  </g>
</svg>

